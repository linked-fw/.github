# The PR gates for every @_linked package: build + test, and a changeset reminder.
#
# The job NAMES below are load-bearing. Every repo's branch protection requires a check called
# exactly `Build & Test`; renaming it stalls every release, because the automated version PR
# can never satisfy a check that no longer reports.
name: PR

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.21.0'
      require-tests:
        description: >-
          `npm test --if-present` lets a package with no test script pass silently. Right for
          the ontology packages, wrong for anything with real logic — those set this true and
          a missing script becomes a failure.
        type: boolean
        default: false
      test-script:
        description: >-
          Which npm script the Test step runs. Defaults to `test`. A package whose `test`
          chains a slow or container-backed suite names its unit script here instead, and
          puts the rest behind `run-e2e` — otherwise consolidating CI silently switches on
          suites that were deliberately gated off.
        type: string
        default: 'test'
      run-e2e:
        description: >-
          Run `npm run test:e2e` as a separate step. Off by default: these suites start
          containers and are slow enough that they are opt-in per run, not per PR.
        type: boolean
        default: false
      cli-version:
        description: >-
          The @_linked/cli that builds the package, as an npm version or range. Installed on
          its own rather than taken from the package's lockfile: most lockfiles pin a CLI from
          before the checks this build exists to run (1.30.0 added "Checking shape references").
        type: string
        default: '^1.30.0'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # The changesets version PR carries only an auto-generated version bump and CHANGELOG,
      # so there is nothing to build. The JOB still has to run and report, though: branch
      # protection requires this check, and a *skipped* job never reports at all, so skipping
      # the job would leave the release PR unmergeable forever. Hence per-step guards.
      - name: Detect release PR
        id: rpr
        # The branch name is attacker-controlled on a fork PR; pass it through env, never
        # interpolate it into the script.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == "changeset-release/main" ]]; then
            echo "is_release_pr=true" >> $GITHUB_OUTPUT
            echo "Release PR from changesets — skipping build/test (version + CHANGELOG only)."
          else
            echo "is_release_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.rpr.outputs.is_release_pr == 'false'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.rpr.outputs.is_release_pr == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      # `packageManager` is a declaration until something acts on it, and nothing did: this job
      # ran `npm ci` with whatever npm the Node image happened to ship, so every repo's
      # `"packageManager": "npm@11.20.0"` was inert on CI and a green check on an npm bump was
      # evidence about the image, not about the version the repo pins.
      #
      # setup-node does NOT close this. From v6 it reads `packageManager` only to decide whether
      # to switch npm caching on; it never installs the npm named there, and it has no `corepack`
      # or `package-manager` input (actions/setup-node#531 is still open).
      #
      # Corepack was the other candidate and was rejected: `corepack enable` does not shim npm
      # unless npm is named explicitly, and Node stops distributing corepack at 25 — so it would
      # carry an expiry date. `npm i -g npm@<exact>` is what `publish.yml` already does, so this
      # is the house pattern rather than a second one.
      #
      # Absent, non-npm or non-exact `packageManager` must NOT fail the build: it warns, leaves
      # the bundled npm in place, and the Verify step below reports that nothing was pinned.
      - name: Use the npm named in packageManager
        id: pm
        if: steps.rpr.outputs.is_release_pr == 'false'
        run: |
          set -euo pipefail

          declared=$(node -p "require('./package.json').packageManager || ''" 2>/dev/null || echo '')
          bundled=$(npm --version)

          if [ -z "$declared" ]; then
            echo "No packageManager field in package.json — keeping the bundled npm $bundled."
            echo "expected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${declared%%@*}" != "npm" ]; then
            echo "::warning title=packageManager not enforced::package.json declares '$declared', but this workflow installs with 'npm ci'. Keeping the bundled npm $bundled."
            echo "expected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The spec requires an exact version, optionally with a `+sha224.…` integrity suffix.
          # A range (`npm@^11`) is not a pin, so it is treated as malformed rather than resolved.
          if [[ ! "$declared" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[^[:space:]]+)?$ ]]; then
            echo "::warning title=packageManager not enforced::'$declared' is not an exact npm version (expected npm@X.Y.Z). Keeping the bundled npm $bundled."
            echo "expected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          want=${declared#npm@}
          want=${want%%+*}

          if [ "$want" = "$bundled" ]; then
            echo "packageManager pins npm@$want, which is already the bundled npm — nothing to install."
          else
            echo "packageManager pins npm@$want; the image bundles $bundled. Installing…"
            npm install --global --no-audit --no-fund "npm@$want"
          fi

          echo "expected=$want" >> "$GITHUB_OUTPUT"

      # The proof, as its own step so the log names it. A change that silently does nothing is
      # the failure this exists to fix, so when the field IS an exact pin, a mismatch here is an
      # error: it means the install above did not take.
      - name: Verify npm matches packageManager
        if: steps.rpr.outputs.is_release_pr == 'false'
        env:
          EXPECTED: ${{ steps.pm.outputs.expected }}
        run: |
          set -euo pipefail
          actual=$(npm --version)
          echo "node --version -> $(node --version)"
          echo "npm  --version -> $actual"

          if [ -z "$EXPECTED" ]; then
            echo "packageManager pins nothing enforceable — ran with the bundled npm $actual."
            exit 0
          fi

          echo "packageManager  -> npm@$EXPECTED"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=packageManager not honoured::package.json pins npm@$EXPECTED but this job is running npm $actual."
            exit 1
          fi
          echo "OK: npm $actual matches the pinned packageManager."

      - name: Install dependencies
        if: steps.rpr.outputs.is_release_pr == 'false'
        run: npm ci

      # `linked build` rather than the package's own `npm run build`: it compiles the same
      # tsconfigs and then runs the checks a plain tsc build never does — shape names, shape
      # references, dependencies. The CLI goes in globally, not through `npx -p`: npx puts
      # the CLI's own node_modules/.bin first on PATH, so its `npx tsc` would compile with
      # the CLI's TypeScript instead of the package's.
      - name: Install Linked CLI
        if: steps.rpr.outputs.is_release_pr == 'false'
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: npm install --global --no-audit --no-fund "@_linked/cli@$CLI_VERSION"

      - name: Build
        if: steps.rpr.outputs.is_release_pr == 'false'
        run: linked build

      - name: Test
        if: steps.rpr.outputs.is_release_pr == 'false'
        run: |
          if [ "${{ inputs.require-tests }}" = "true" ]; then
            npm run ${{ inputs.test-script }}
          else
            npm run ${{ inputs.test-script }} --if-present
          fi

      - name: Test (e2e)
        if: steps.rpr.outputs.is_release_pr == 'false' && inputs.run-e2e
        run: npm run test:e2e --if-present

  changeset-check:
    name: Check for changeset
    # Nothing to remind about on the PR that consumes the changesets.
    if: ${{ github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    # The reminder is posted as a PR comment, which needs write access to pull requests. A
    # reusable workflow cannot grant itself more than its caller holds, so the caller has to
    # pass this down too — without it the step dies on "Resource not accessible by
    # integration", which names a permission nowhere in the message.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A warning, never a failure: plenty of PRs (docs, CI, refactors) should not cut a
      # release, and a gate that is wrong half the time gets ignored the other half.
      - name: Check for changeset files
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const hasChangeset = files.some(f =>
              f.filename.startsWith('.changeset/') &&
              f.filename.endsWith('.md') &&
              f.filename !== '.changeset/README.md'
            );

            if (!hasChangeset) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "No changeset found. If this PR should trigger a release, run `npx changeset` and commit the generated file.\n\nIf this change doesn't need a release (docs, CI config, etc.), you can ignore this message."
              });
              core.warning('No changeset file found in this PR.');
            }
