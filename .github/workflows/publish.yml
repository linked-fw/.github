# The release pipeline for every @_linked package.
#
# Callers keep a stub at `.github/workflows/publish.yml` and that path is LOAD-BEARING: npm's
# trusted-publisher check validates the *calling* workflow's filename, not this one. Renaming a
# caller invalidates that package's trusted publisher and silently drops it to staging.
#
# One release takes TWO runs of this workflow, by design:
#
#   1. A PR carrying a changeset merges. changesets sees pending changesets, opens/updates the
#      `chore: release` PR (versions + CHANGELOG), and this workflow merges that PR itself.
#   2. That merge pushes main again. No changesets remain, so the publish step runs.
name: Publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.21.0'
      npm-version:
        description: >-
          FALLBACK only: the release runs on the npm pinned in the package's `packageManager`,
          exactly as pr.yml does. This is installed when that field is absent or not an exact
          npm pin, or pins an npm older than 11.15.0 (`npm stage` landed in CLI 11.15.0). A
          range rather than `@latest`, so that even the fallback is decided here and not by
          whichever npm the Node image happens to ship.
        type: string
        default: '^11.15.0'
      cli-version:
        description: >-
          The @_linked/cli that builds the package, as an npm version or range. Same input,
          same default as pr.yml: the release must be built by the same CLI that built the PR,
          or what is published is not what was checked.
        type: string
        default: '^1.30.0'
    secrets:
      NPM_TOKEN:
        description: 'Stage-only npm token. The FALLBACK credential — unused when the package has a trusted publisher.'
        required: true
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for BOTH provenance signing and OIDC trusted publishing. npm's docs are
      # explicit that this must be granted to the caller AND to this workflow — miss it on
      # either side and every OIDC publish quietly falls back to staging.
      id-token: write
    steps:
      # Author the version PR as the org release App, not the default GITHUB_TOKEN. PRs from
      # `github-actions[bot]` are held behind a manual "Approve and run" gate by the org's
      # first-time-contributor policy, so their CI never runs unattended.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'

      # The release runs on the npm the package pins in `packageManager` — the same one pr.yml
      # installs and asserts — so a release is built, locked and published by the npm its PR
      # checks ran on. Before this, publish installed `npm-version` regardless of the pin, so a
      # repo pinned to npm 12 was released on npm 11, and the lock refresh in every
      # `chore: release` commit was written by a different npm major than the repo uses.
      #
      # The parsing (exact `npm@X.Y.Z` only, `+sha…` suffix stripped) is the same as pr.yml's
      # step of the same name; change both together. It is duplicated rather than shared: a
      # composite action used from a reusable workflow would have to be referenced by its own
      # `linked-fw/.github/...@v1` ref, which is one more ref to keep in step.
      #
      # Two differences from pr.yml, both because this job must be able to stage:
      #   - When the pin is unusable (absent, non-npm, not exact) it installs the `npm-version`
      #     input instead of keeping the bundled npm — what this step always did before.
      #   - A pin below 11.15.0 (no `npm stage`) is overridden by `npm-version`, with a warning.
      - name: Use the npm named in packageManager
        id: pm
        env:
          FALLBACK: ${{ inputs.npm-version }}
        run: |
          set -euo pipefail

          declared=$(node -p "require('./package.json').packageManager || ''" 2>/dev/null || echo '')
          bundled=$(npm --version)
          want=''

          if [ -z "$declared" ]; then
            echo "No packageManager field in package.json — using the npm-version input ($FALLBACK)."
          elif [ "${declared%%@*}" != "npm" ]; then
            echo "::warning title=packageManager not enforced::package.json declares '$declared', but this workflow installs with 'npm ci'. Using the npm-version input ($FALLBACK)."
          # The spec requires an exact version, optionally with a `+sha224.…` integrity suffix.
          # A range (`npm@^11`) is not a pin, so it is treated as malformed rather than resolved.
          elif [[ ! "$declared" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[^[:space:]]+)?$ ]]; then
            echo "::warning title=packageManager not enforced::'$declared' is not an exact npm version (expected npm@X.Y.Z). Using the npm-version input ($FALLBACK)."
          else
            want=${declared#npm@}
            want=${want%%+*}
            IFS=. read -r major minor _ <<<"${want%%-*}"
            if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 15 ]; }; then
              echo "::warning title=packageManager too old to stage::package.json pins npm@$want, but 'npm stage' needs 11.15.0 or later. Using the npm-version input ($FALLBACK)."
              want=''
            fi
          fi

          if [ -z "$want" ]; then
            npm install --global --no-audit --no-fund "npm@$FALLBACK"
            echo "expected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$want" = "$bundled" ]; then
            echo "packageManager pins npm@$want, which is already the bundled npm — nothing to install."
          else
            echo "packageManager pins npm@$want; the image bundles $bundled. Installing…"
            npm install --global --no-audit --no-fund "npm@$want"
          fi

          echo "expected=$want" >> "$GITHUB_OUTPUT"

      # The same proof as pr.yml's step of the same name: when the pin was used, a mismatch here
      # means the install above did not take, and the release must not go out on another npm.
      - name: Verify npm matches packageManager
        env:
          EXPECTED: ${{ steps.pm.outputs.expected }}
        run: |
          set -euo pipefail
          actual=$(npm --version)
          echo "node --version -> $(node --version)"
          echo "npm  --version -> $actual"

          if [ -z "$EXPECTED" ]; then
            echo "packageManager pins nothing usable — ran with npm $actual from the npm-version input."
            exit 0
          fi

          echo "packageManager  -> npm@$EXPECTED"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=packageManager not honoured::package.json pins npm@$EXPECTED but this job is running npm $actual."
            exit 1
          fi
          echo "OK: npm $actual matches the pinned packageManager."

      - name: Install dependencies
        run: npm ci

      # The same build as pr.yml — `linked build` from a globally installed CLI, not the
      # package's `npm run build` — so the tarball is the output CI checked. With the two builds
      # different, packages shipped defects the PR build never produced: a `main` naming a
      # lib/cjs the plain build never emits, and extensionless ESM specifiers that `linked build`
      # rewrites but plain `tsc` leaves as written. Global rather than `npx -p` for the reason
      # given in pr.yml: npx would compile with the CLI's TypeScript instead of the package's.
      #
      # A package must not rebuild in `prepublishOnly`/`prepack`: `npm publish` runs those
      # AFTER this step and would replace the checked output with a second build.
      - name: Install Linked CLI
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: npm install --global --no-audit --no-fund "@_linked/cli@$CLI_VERSION"

      - name: Build
        run: linked build

      # `changeset version` bumps package.json but never package-lock.json, so every
      # `chore: release` commit left the lock header (`version` and `packages[""].version`) one
      # release behind, and the next `npm install` in any checkout rewrote it — a dirty lockfile
      # nobody had touched. This script runs the same `changeset version` the action runs by
      # default, then re-syncs the lock, so both land in the version PR's commit.
      #
      # It is a script file because the action exec()s `version:` without a shell: `&&` there
      # would be passed to changeset as an argument. It runs under the npm installed above — the
      # one `npm ci` used — so the lock's format does not flip between npm majors.
      # `--package-lock-only` writes only the lockfile and keeps every existing resolution; the
      # lock is already known to match package.json, since `npm ci` above fails otherwise, so in
      # practice only the bumped versions change (in a workspace repo, the bumped members'
      # entries too).
      #
      # `--allow-remote=all`: npm 12 defaults `allow-remote` to `none` and then refuses to fetch a
      # tarball the lock does not already describe — which is what a package with
      # `bundleDependencies` (e.g. @tailwindcss/oxide-wasm32-wasi) needs when its bundled
      # `inBundle` entries are missing from the lock, failing the release with EALLOWREMOTE. The
      # fetch only reads the bundled entries back out of the already-locked tarball; it changes no
      # resolution. npm 11 knows the flag too (its default is already `all`), so this is a no-op
      # there.
      - name: Prepare the version script
        run: |
          cat > "$RUNNER_TEMP/changeset-version.sh" <<'EOF'
          set -euo pipefail
          node "$(node -p 'require.resolve("@changesets/cli/bin.js")')" version
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --allow-remote=all
          fi
          EOF

      # No `publish:` input — changesets only opens/updates the version PR. Publishing is the
      # step below, so that the OIDC-or-stage decision is ours to make rather than buried in
      # `changeset publish`'s call to `npm publish`.
      - name: Create release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bash ${{ runner.temp }}/changeset-version.sh
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Publish, by whichever route the package is set up for.
      #
      # Idempotent: this runs on EVERY push to main, so it must do nothing when the version is
      # already on the registry or already sitting in the approval queue.
      - name: Publish
        if: steps.changesets.outputs.hasChangesets != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          private=$(node -p "require('./package.json').private === true")

          if [ "$private" = "true" ]; then
            echo "$name is private — nothing to publish."; exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry — nothing to do."; exit 0
          fi
          if npm stage list "$name" 2>/dev/null | grep -q "$version"; then
            echo "$name@$version is already staged and waiting for approval."; exit 0
          fi

          # Is an OIDC token even obtainable here? `ACTIONS_ID_TOKEN_REQUEST_URL` is injected
          # only when `id-token: write` is granted — to the CALLER as well as to this
          # workflow, since a reusable workflow cannot widen what it was given. If this says
          # "no", the fault is on the GitHub side; if it says "yes" and the publish still
          # cannot authenticate, the fault is the npm-side trusted-publisher registration.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: an id-token IS obtainable in this job."
          else
            echo "::warning title=No OIDC token::ACTIONS_ID_TOKEN_REQUEST_URL is unset — 'id-token: write' is missing on the caller or this workflow, so trusted publishing cannot be attempted."
          fi

          # The direct publish runs with the token BLANKED, so the only credential it can use is
          # an OIDC trusted publisher. npm silently falls back from OIDC to whatever token is
          # configured, so with the token present a 2FA-bypass token would publish directly
          # here — and the notice below would credit OIDC for it (it did, in linked-cm). Blank, a
          # success can only mean OIDC, and the token is only ever used for the staged release.
          # (Empty rather than unset: setup-node's .npmrc references ${NODE_AUTH_TOKEN}.)
          echo "Publishing $name@$version via OIDC trusted publishing…"
          if out=$(NODE_AUTH_TOKEN= NPM_TOKEN= npm publish --access public --provenance 2>&1); then
            echo "$out"
            echo "::notice title=Published::$name@$version published directly via OIDC trusted publishing."
            exit 0
          fi
          echo "OIDC publish did not succeed — falling back to a staged release. Reason:"
          echo "$out"

          # No trusted publisher shows up as an auth failure, which npm reports under several
          # codes depending on whether the package exists yet. linked-cm measured ENEEDAUTH.
          if grep -qE 'ENEEDAUTH|E401|E403|E404|EOTP|E_STAGE_REQUIRED' <<<"$out"; then
            echo "::warning title=Staged, not published::$name@$version needs manual approval. To publish it directly, register a trusted publisher on npmjs.com for $name with owner '${GITHUB_REPOSITORY%%/*}', repo '${GITHUB_REPOSITORY##*/}' and workflow 'publish.yml'."
          else
            echo "::error title=Publish failed::$name@$version failed for a reason unrelated to authentication. See the log above."
            exit 1
          fi

          # Capture the output: `npm stage publish` prints the stage id, and `npm stage approve`
          # takes ONLY that id — a package spec is rejected with "stage-id must be a valid
          # UUID". Without this the notice below hands out a command that does not work.
          staged=$(npm stage publish --access public --provenance 2>&1 | tee /dev/stderr)
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          # `|| true` because the script runs under `set -euo pipefail`: a grep that matches
          # nothing exits 1 and would fail the step even though the staging itself succeeded.
          stage_id=$(printf '%s' "$staged" | grep -oE "$uuid" | tail -1 || true)

          {
            echo "### 📦 \`$name@$version\` is staged, not published"
            echo
            echo "It is uploaded and held for review. **Approve it to make it public:**"
            echo
            if [ -n "$stage_id" ]; then
              echo "- **CLI:** \`npm stage approve $stage_id\`"
            else
              echo "- **CLI:** \`npm stage list $name\` to find the id, then \`npm stage approve <stage-id>\`"
            fi
            echo "- **Web:** [npmjs.com](https://www.npmjs.com) → your avatar → **Staged Packages** → **Approve**."
            echo "  The button stays disabled until npm has finished scanning the tarball."
            echo
            echo "Both prompt for 2FA. Until then \`npm install $name\` still resolves"
            echo "\`$(npm view "$name" version 2>/dev/null || echo 'nothing')\`."
            echo
            echo "To skip this queue in future, register a trusted publisher for \`$name\`:"
            echo "owner \`${GITHUB_REPOSITORY%%/*}\`, repo \`${GITHUB_REPOSITORY##*/}\`, workflow \`publish.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$stage_id" ]; then
            echo "::notice title=Approval needed::$name@$version is staged. Run: npm stage approve $stage_id"
          else
            echo "::notice title=Approval needed::$name@$version is staged, but the stage id could not be read. Run: npm stage list $name"
          fi

      # When changesets opened/updated the version PR, merge it so the release proceeds without
      # a manual click. The App token is used so the merge's push re-triggers this workflow,
      # which then publishes.
      #
      # DIRECT merge, not `--auto`: auto-merge ignores branch-protection review-bypass
      # allowances. `main` is check-only, so a direct merge lands as soon as the required
      # "Build & Test" check is green — hence the retry rather than a single attempt.
      - name: Merge the version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open version PR (nothing to merge)."; exit 0; fi
          for i in $(seq 1 40); do
            if gh pr merge "$pr" --merge 2>/tmp/merge_err; then
              echo "Merged version PR #$pr on attempt $i."
              exit 0
            fi
            echo "Attempt $i/40: version PR #$pr not mergeable yet ($(tr -d '\n' < /tmp/merge_err)); waiting for the required check…"
            sleep 15
          done
          echo "::warning::Version PR #$pr not merged after retries — merge it manually."
